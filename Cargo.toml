[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Distorbed678/Zenith"
homepage = "https://distorbed678.github.io/Zenith/"
authors = ["Zenith contributors"]
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha1 = "0.10"
hex = "0.4"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
dirs = "6"
# Compress with the same zlib the JVM uses on this platform, so compressed bytes match vanilla on the same machine:
# Linux JDKs link the *system* zlib (e.g. zlib-ng-compat on some distros), so we link it dynamically there; Windows
# and macOS JDKs bundle stock zlib, so crates add the `static` feature for those targets.
# See docs/specs/storage/region-and-level.md (parity status).
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1", default-features = false, features = ["libc"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
