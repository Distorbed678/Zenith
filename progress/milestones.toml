# Zenith progress source of truth.
# `cargo xtask progress` merges this file with parity results in progress/parity/*.json and writes:
#   progress/progress.json          (consumed by the website dashboard)
#   progress/history.json           (overall % over time)
#   docs/assets/tracker/*.svg       (visual tracker embedded in README.md)
#
# Milestone percent:
#   - no suites:   done_tasks / total_tasks
#   - with suites: mean(task completion, suite pass ratio)
#   A milestone can only be "done" once every linked suite is at 100%.
# Overall percent = weighted mean of milestone percents. Weights are relative effort estimates.
# status: planned | in-progress | done

[meta]
project = "Zenith"
target_version = "26.3"
protocol = 777
world_version = 5023

[[phase]]
id = "P0"
title = "Foundation"
blurb = "Repo, rules, plan, hygiene guard, ownership proof, tracker, website."

[[phase]]
id = "P1"
title = "Core data"
blurb = "Parity harness, NBT, saves, registries, codecs, data packs. All headless."

[[phase]]
id = "P2"
title = "World simulation"
blurb = "RNG, noise, worldgen, lighting, ticking, entities, items, commands. Headless server."

[[phase]]
id = "P3"
title = "Networking"
blurb = "Protocol 777 end to end; the Zenith dedicated server accepts vanilla clients."

[[phase]]
id = "P4"
title = "Client"
blurb = "Vulkan renderer, resources, GUI, audio, singleplayer. Pixel-exact."

[[phase]]
id = "P5"
title = "Platform"
blurb = "Microsoft sign-in, WASM mods, mod index, modpacks, launcher, in-game mod manager."

[[phase]]
id = "P6"
title = "Speed & release"
blurb = "Performance program and the 1.0 release for 26.3."

[[phase]]
id = "P7"
title = "More versions"
blurb = "Next-release port via the version diff bot, older versions, research."

